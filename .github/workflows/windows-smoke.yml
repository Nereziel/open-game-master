name: Windows smoke

# Windows compatibility checks are useful for native Node dependencies,
# filesystem paths and external process handling, but do not need to duplicate
# the Linux test suite for every PR and every push.
# Run the complete Windows matrix on published releases or manually when
# changing native dependencies, installers or Windows-specific code.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# A release and a manual run are independent; do not cancel either.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: windows build
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs

  # The suite took 30 of its 45 minutes in one job by 0.30.0; the runners
  # share its files instead, each running its share a few at a time
  # (vitest.config.mts). A share takes 18 to 20 minutes on a usual runner; a
  # slow one ran out its 30 on 0.35.0 with every test still passing, so the
  # limit leaves room for a slow runner and still stops a hung test.
  tests:
    name: windows tests (${{ matrix.shard }}/3)
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --shard=${{ matrix.shard }}/3
