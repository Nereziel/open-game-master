name: Windows smoke

# Explicit native build or full validation, never on every push or PR.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build only or full Windows validation"
        type: choice
        options: [build, full]
        default: build
        required: true

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows build
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs

  # The suite took 30 of its 45 minutes in one job by 0.30.0; the runners
  # share its files instead, each running its share a few at a time
  # (vitest.config.mts). A share takes 18 to 20 minutes on a usual runner; a
  # slow one ran out its 30 on 0.35.0 with every test still passing, so the
  # limit leaves room for a slow runner and still stops a hung test.
  tests:
    needs: build
    if: ${{ inputs.mode == 'full' }}
    name: windows tests (${{ matrix.shard }}/3)
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --shard=${{ matrix.shard }}/3
