name: Windows smoke

# Explicit native build or full validation, never on every push or PR.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build only or full Windows validation"
        type: choice
        options: [build, full]
        default: build
        required: true

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows build
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs

  # Keep at most two Windows test runners occupied even in full mode.
  # All five shards still run; other repositories retain available capacity.
  tests:
    name: windows tests (${{ matrix.shard }}/5)
    needs: build
    if: ${{ inputs.mode == 'full' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Full tests
        run: npm test -- --shard=${{ matrix.shard }}/5
