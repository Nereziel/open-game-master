name: Linux smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# onnxruntime-node's install script downloads its CUDA and TensorRT
# providers from api.nuget.org on every Linux npm ci, and a download that
# timed out failed the whole job. The app embeds on the CPU only (the
# Dockerfile deletes those providers), so no job here needs them.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

# Run checks only for commits on main or when explicitly requested.
# Only the latest main push needs the full matrix. Group by branch,
# not SHA, so superseded pushes cancel rather than consuming 10 more jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job doing all of this took 60 minutes by 0.30.0 (213 scenario runs,
# 770-odd test files one at a time): the work is split across runners
# instead, each a few minutes plus its own install and build.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js stores reusable compiler output here. setup-node already caches
      # npm downloads; cache only .next/cache, never the whole .next build.
      # The build job is the only writer to avoid six browser-shard uploads.
      - name: Restore and save Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next16-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next16-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npm run lint

      # Unused locals, parameters, exports and files (tsc's strict unused
      # checks, then knip.jsonc). Code nothing reaches is cut, not left to rot.
      - name: Dead code
        run: npm run dead-code

      - name: Build
        run: npm run build

      # A route's first-load JS and CSS against scripts/bundle-budget.json.
      - name: First-load size budgets
        run: node scripts/check-bundle-budget.mjs

      # One payload built on Linux ships to every desktop platform, so the
      # compiled server has to keep its Windows branches wherever it is built.
      - name: The built server keeps its Windows code
        run: node scripts/check-built-platform.mjs

  # Each runner takes a share of the files and runs them a few at a time
  # (vitest.config.mts), each file in its own process.
  tests:
    name: tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test -- --shard=${{ matrix.shard }}/3

  # Full Chromium scenarios are slower and build the app six more times.
  # Run these after code reaches main or by manual request, not on every PR.
  # Only commits on main or explicit manual runs are checked.
  browser:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: browser (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser shards can reuse a prior successful main build's compiler cache
      # but do not upload six copies or depend on the build job finishing.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next16-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next16-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # The browser is kept between runs for the playwright-core version that
      # drives it; its system libraries are not, so they are installed either way.
      - name: Read the browser's version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps chromium

      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium

      - name: Browser scenarios
        run: npm run test:browser -- --shard ${{ matrix.shard }}/6
