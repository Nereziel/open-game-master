name: Czech localization checks

on:
  pull_request:
    paths:
      - "src/lib/i18n/**"
      - "src/lib/content/**"
      - "src/lib/srd/**"
      - "src/lib/help/**"
      - "src/app/characters/**"
      - "src/app/campaigns/**"
      - "src/components/**"
      - "scripts/audit-cs-ui-keys.mjs"
      - "scripts/generate-cs-localization.mjs"
      - "docs/czech-translations.md"
      - ".github/workflows/czech-i18n.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The app does not need CUDA/TensorRT during CI builds.
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization:
    name: Czech localization and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Czech catalog and placeholders
        run: npm run i18n:cs:check

      - name: Verify UI audit (including Windows path behavior)
        run: npm run i18n:cs:ui-test

      # The initial 49 missing literal keys are now covered. Unexpected
      # untranslated UI strings and duplicate JSON keys must fail the PR.
      # Advisory hardcoded JSX candidates remain non-blocking.
      - name: Enforce Czech UI key coverage
        run: npm run i18n:cs:ui-check

      - name: Report possible hardcoded Czech JSX candidates
        run: npm run i18n:cs:ui-report

      - name: Czech localization regression tests
        run: npm test -- src/lib/i18n/czech-catalog-migration.test.ts src/lib/i18n/czech-catalog-coverage.test.ts src/lib/i18n/workshop-czech-coverage.test.ts src/lib/srd/skill-help-cs.test.ts src/lib/i18n/game-text.test.ts src/lib/characters/event-summary-cs.test.ts src/app/campaigns/[campaignId]/lead-edit-cs.test.ts

      - name: TypeScript type check
        run: npx tsc --noEmit --incremental false

      - name: Application build
        run: npm run build
