name: Shared game and PDF terminology

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Czech/English/French terminology and character PDF regressions
        run: npm test -- src/lib/srd/ability-short-label.test.ts src/lib/srd/skill-help-cs.test.ts src/lib/pdf/character-sheet-pdf.test.ts src/lib/i18n/game-text.test.ts src/lib/battlemap/condition-notes-locale.test.ts src/components/sheet/sheet-state-locale.test.ts src/app/campaigns/[campaignId]/lead-edit-cs.test.ts src/components/sheet/spell-name-search.test.ts src/lib/srd/multiclass-locale.test.ts
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Build
        run: npm run build
