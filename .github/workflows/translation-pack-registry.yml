name: Source-scoped translation registry
on:
  push:
    branches: [main]
    paths:
      - "src/lib/content/translations/**"
      - "src/lib/rulebook/czech-terms.ts"
      - "src/lib/rulebook/czech-companion.ts"
      - "src/lib/content/names-cs.ts"
      - "src/lib/content/names.ts"
      - "src/lib/content/names-source.test.ts"
      - "docs/srd-translation-adapter.md"
      - ".github/workflows/translation-pack-registry.yml"
  pull_request:
    paths:
      - "src/lib/content/translations/**"
      - "src/lib/content/names.ts"
      - "src/lib/content/names-source.test.ts"
      - "src/lib/dm/shop-tools.ts"
      - "src/lib/dm/shop-logic.ts"
      - "src/lib/dm/shop-source.test.ts"
      - "src/lib/dm/purchase-math.ts"
      - "src/lib/dm/purchase-source.test.ts"
      - "src/lib/dm/resource-tool-defs.ts"
      - "src/lib/db/shops.ts"
      - "docs/srd-translation-adapter.md"
      - "docs/translation-pack-registry.md"
      - ".github/workflows/translation-pack-registry.yml"
  workflow_dispatch:

jobs:
  translation-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Registry and SRD adapter regression tests
        run: npx vitest run src/lib/content/translations src/lib/content/names-source.test.ts "src/app/campaigns/[campaignId]/lead-edit-identity.test.ts" src/app/characters/builder/pickerRows.test.ts src/lib/pdf/source-name.test.ts src/lib/dm/mutation-math-source.test.ts src/lib/dm/party-source.test.ts src/lib/dm/item-logic-source.test.ts src/lib/dm/purchase-source.test.ts src/lib/dm/shop-source.test.ts
      # Main already fails the separate dead-code gate on four unused bindings.
      # Check type safety here; do not conceal the baseline dead-code errors.
      - name: TypeScript typecheck
        run: npx tsc --noEmit --incremental false --noUnusedLocals false --noUnusedParameters false
