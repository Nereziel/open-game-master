name: Localized system event log

on:
  pull_request:
    paths:
      - "src/app/campaigns/**/event-log-logic.ts"
      - "src/app/campaigns/**/event-log-localization.test.ts"
      - "src/lib/i18n/cs.json"
      - "src/lib/i18n/fr.json"
      - ".github/workflows/localized-event-log.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify CS/FR message placeholders
        run: npm run i18n:cs:check
      - name: Localized event-log Vitest
        run: npm test -- src/app/campaigns/[campaignId]/event-log-localization.test.ts
      - name: Legacy English event-log regressions
        run: node scripts/test-event-log-logic.mjs
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Build
        run: npm run build
